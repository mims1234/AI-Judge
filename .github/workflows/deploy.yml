name: Deploy AI Judge

on:
  push:
    branches: [main]
  workflow_dispatch:

# Personal repo (mims1234/AI-Judge). Needs a repo-level self-hosted runner
# on the VPS — the Tempest-Developers org runner will not claim these jobs.
# App path: /root/mims/AI-Judge   PM2 name: ai-judge   loopback: 127.0.0.1:3017
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   AI_JUDGE_MODE, OPENROUTER_API_KEY, OPENROUTER_BASE_URL, DATABASE_PATH, PORT
#
# If those secrets are not set, deploy keeps the existing VPS .env.local.
# Only the five keys above are ever written; every other line in .env.local
# (AUTH_SECRET, AUTH_DISCORD_ID, AUTH_DISCORD_SECRET, AUTH_URL, comments) is kept.
# If .env.local is missing, it is created with defaults (BYOK — key may be empty).
#
# IMPORTANT: never put empty Actions secrets into the PM2 process env.
# The app loads .env.local; `pm2 restart --update-env` with blank secrets will
# shadow real values. Do not use --update-env.

concurrency:
  group: ai-judge-production
  cancel-in-progress: false

jobs:
  # Lint and tests must pass on a clean checkout before anything touches the VPS.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: self-hosted

    steps:
      # setup-node puts its own bin first on PATH, and an older pm2 can live
      # there. Keep the pm2 CLI that matches the running daemon.
      - name: Locate PM2
        run: |
          echo "PM2=$(command -v pm2)" >> "$GITHUB_ENV"

      # Pin Node for every step, including the PM2 app (ecosystem.config.js
      # uses this binary as its interpreter). The VPS /usr/bin/node is older
      # than the Node 22 that node_modules native addons are built for.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show Node version
        run: |
          echo "node $(node -v) at $(command -v node)"
          echo "pm2 $("$PM2" -v) at $PM2"

      # Runs before anything is changed, so a failed backup leaves the live app
      # untouched. New migrations apply on the first request after restart.
      - name: Back up database
        env:
          HOME: /root
        run: |
          set -euo pipefail
          APP_DIR=/root/mims/AI-Judge
          cd "$APP_DIR"
          if [ -f scripts/backup.ts ] && [ -d node_modules ] && ls data/*.sqlite >/dev/null 2>&1; then
            npm run db:backup
            # Keep the 10 newest backups.
            (ls -1t data/backups/ai-judge-*.sqlite 2>/dev/null || true) | tail -n +11 | xargs -r rm -f --
          else
            echo "No database or tooling yet - skipping backup"
          fi

      - name: Sync code and .env.local
        env:
          HOME: /root
          PM2_HOME: /root/.pm2
          AI_JUDGE_MODE: ${{ secrets.AI_JUDGE_MODE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
          PORT: ${{ secrets.PORT }}
        run: |
          set -euo pipefail
          APP_DIR=/root/mims/AI-Judge
          cd "$APP_DIR"

          echo "--- PM2 home: ${PM2_HOME} (HOME=${HOME}) ---"

          echo "--- Pulling latest code (app stays up until build succeeds) ---"
          git fetch origin
          git reset --hard origin/main

          echo "--- Ensuring data directory ---"
          mkdir -p data

          echo "--- Syncing .env.local ---"
          python3 - <<'PY'
          import os
          from pathlib import Path

          # Keys this deploy manages. Every other line in .env.local (AUTH_SECRET,
          # AUTH_DISCORD_ID, comments, ...) is kept exactly as it is.
          managed = [
              "AI_JUDGE_MODE",
              "OPENROUTER_API_KEY",
              "OPENROUTER_BASE_URL",
              "DATABASE_PATH",
              "PORT",
          ]
          defaults = {
              "OPENROUTER_BASE_URL": "https://openrouter.ai/api/v1",
              "DATABASE_PATH": "./data/ai-judge.sqlite",
              "PORT": "3017",
          }

          env_path = Path(".env.local")
          existed = env_path.is_file()
          lines = env_path.read_text(encoding="utf-8").splitlines() if existed else []
          provided = {k: str(os.environ.get(k, "")).strip() for k in managed}

          def key_of(raw):
              stripped = raw.strip()
              if not stripped or stripped.startswith("#") or "=" not in stripped:
                  return None
              return stripped.split("=", 1)[0].strip()

          existing = {}
          for raw in lines:
              key = key_of(raw)
              if key is not None:
                  existing[key] = raw.split("=", 1)[1].strip()

          # Non-empty secrets win; blank or missing URL/path/port fall back to defaults
          # so `next build` prerender does not fail. Empty secrets never overwrite.
          updates = {k: v for k, v in provided.items() if v}
          for key in ("OPENROUTER_BASE_URL", "DATABASE_PATH"):
              if key not in updates and not existing.get(key, ""):
                  updates[key] = defaults[key]
          if not existed:
              for key in managed:
                  updates.setdefault(key, provided[key] or defaults.get(key, ""))

          out = []
          written = set()
          for raw in lines:
              key = key_of(raw)
              if key in updates:
                  if key not in written:
                      out.append(f"{key}={updates[key]}")
                      written.add(key)
                  continue
              out.append(raw)
          for key in managed:
              if key in updates and key not in written:
                  out.append(f"{key}={updates[key]}")
                  written.add(key)

          if not existed:
              out.insert(0, "# Generated by GitHub Actions deploy")

          # Do not print values.
          if out != lines:
              env_path.write_text("\n".join(out) + "\n", encoding="utf-8")
              os.chmod(env_path, 0o600)
              kept = len([raw for raw in lines if key_of(raw) not in updates])
              print(f".env.local updated: {', '.join(sorted(written))} ({kept} other lines kept)")
          else:
              print(".env.local unchanged")
          PY

          echo "--- Installing dependencies ---"
          npm ci

          echo "--- Building Next.js ---"
          npm run build
          test -f .next/BUILD_ID

      - name: Restart ai-judge only
        env:
          # No app secrets here — avoid baking empty Action secrets into PM2.
          HOME: /root
          PM2_HOME: /root/.pm2
        run: |
          set -euo pipefail
          APP_DIR=/root/mims/AI-Judge
          cd "$APP_DIR"

          echo "--- Reloading ai-judge from ecosystem.config.js ---"
          # Stop only after a successful build. Delete + start from this
          # repo's ecosystem. Do NOT use --update-env.
          "$PM2" stop ai-judge || true
          "$PM2" delete ai-judge || true
          "$PM2" start ecosystem.config.js
          "$PM2" save
          echo "--- PM2 describe ---"
          "$PM2" describe ai-judge | head -n 80 || true

      - name: Verify Deployment
        env:
          HOME: /root
          PM2_HOME: /root/.pm2
        run: |
          set -euo pipefail
          cd /root/mims/AI-Judge
          echo "--- PM2 Status ---"
          "$PM2" status ai-judge
          echo "--- .env.local presence (values hidden) ---"
          if [ -f .env.local ]; then
            echo ".env.local found ($(wc -l < .env.local) lines, mode $(stat -c %a .env.local 2>/dev/null || echo '?'))"
            for key in OPENROUTER_BASE_URL DATABASE_PATH; do
              if grep -q "^${key}=.\+" .env.local; then
                echo "  ✓ $key"
              else
                echo "  · $key unset (defaults apply)"
              fi
            done
            if grep -q '^OPENROUTER_API_KEY=.\+' .env.local; then
              echo "  · OPENROUTER_API_KEY (set — unused in prod BYOK)"
            else
              echo "  · OPENROUTER_API_KEY (empty — BYOK)"
            fi
          else
            echo "WARNING: .env.local MISSING"
            exit 1
          fi
          echo "--- SQLite data directory ---"
          ls -ld data || echo "WARNING: data directory MISSING"
          sleep 3
          status=$("$PM2" jlist | python3 -c "import sys,json; apps=json.loads([l for l in sys.stdin if l.startswith('[')][-1]); print(next((a['pm2_env']['status'] for a in apps if a['name']=='ai-judge'), 'missing'))")
          echo "ai-judge status: $status"
          if [ "$status" != "online" ]; then
            echo "--- recent error log ---"
            "$PM2" logs ai-judge --err --lines 20 --nostream || true
            exit 1
          fi
          echo "--- Loopback health ---"
          HEALTHY=0
          for ATTEMPT in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1:3017/; then
              HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" -ne 1 ]; then
            echo "ERROR: http://127.0.0.1:3017/ did not respond"
            "$PM2" logs ai-judge --err --lines 40 --nostream || true
            exit 1
          fi
          echo "--- Deploy complete ---"
