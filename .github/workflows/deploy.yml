name: Deploy AI Judge

on:
  push:
    branches: [main]
  workflow_dispatch:

# Personal repo (mims1234/AI-Judge). Needs a repo-level self-hosted runner
# on the VPS — the Tempest-Developers org runner will not claim these jobs.
# App path: /root/mims/AI-Judge   PM2 name: ai-judge   loopback: 127.0.0.1:3017
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   AI_JUDGE_MODE, OPENROUTER_API_KEY, OPENROUTER_BASE_URL, DATABASE_PATH, PORT
#
# If those secrets are not set, deploy keeps the existing VPS .env.local.
# If .env.local is missing, it is created from .env.example (BYOK — key may be empty).
#
# IMPORTANT: never put empty Actions secrets into the PM2 process env.
# The app loads .env.local; `pm2 restart --update-env` with blank secrets will
# shadow real values. Do not use --update-env.

concurrency:
  group: ai-judge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Sync code and .env.local
        env:
          HOME: /root
          PM2_HOME: /root/.pm2
          AI_JUDGE_MODE: ${{ secrets.AI_JUDGE_MODE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          DATABASE_PATH: ${{ secrets.DATABASE_PATH }}
          PORT: ${{ secrets.PORT }}
        run: |
          set -euo pipefail
          APP_DIR=/root/mims/AI-Judge
          cd "$APP_DIR"

          echo "--- PM2 home: ${PM2_HOME} (HOME=${HOME}) ---"

          echo "--- Stopping ai-judge only ---"
          pm2 stop ai-judge || true

          echo "--- Pulling latest code ---"
          git fetch origin
          git reset --hard origin/main

          echo "--- Ensuring data directory ---"
          mkdir -p data

          echo "--- Syncing .env.local ---"
          python3 - <<'PY'
          import os
          from pathlib import Path

          optional = [
              "AI_JUDGE_MODE",
              "OPENROUTER_API_KEY",
              "OPENROUTER_BASE_URL",
              "DATABASE_PATH",
              "PORT",
          ]

          env_path = Path(".env.local")
          example_path = Path(".env.example")
          provided = {k: str(os.environ.get(k, "")).strip() for k in optional}
          has_any_secret = any(provided.values())

          def write_env(lines: list[str]) -> None:
              env_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              os.chmod(env_path, 0o600)

          if env_path.is_file() and not has_any_secret:
              print("GitHub secrets unset — keeping existing .env.local")
          elif env_path.is_file() and has_any_secret:
              existing: dict[str, str] = {}
              for raw in env_path.read_text(encoding="utf-8").splitlines():
                  if not raw.strip() or raw.lstrip().startswith("#") or "=" not in raw:
                      continue
                  key, value = raw.split("=", 1)
                  existing[key] = value
              for key, value in provided.items():
                  if value:
                      existing[key] = value
              existing.setdefault("OPENROUTER_BASE_URL", "https://openrouter.ai/api/v1")
              existing.setdefault("DATABASE_PATH", "./data/ai-judge.sqlite")
              existing.setdefault("PORT", "3017")
              lines = [
                  "# Updated by GitHub Actions deploy — only keys present as secrets were changed",
                  f"AI_JUDGE_MODE={existing.get('AI_JUDGE_MODE', '')}",
                  f"OPENROUTER_API_KEY={existing.get('OPENROUTER_API_KEY', '')}",
                  f"OPENROUTER_BASE_URL={existing['OPENROUTER_BASE_URL']}",
                  f"DATABASE_PATH={existing['DATABASE_PATH']}",
                  f"PORT={existing['PORT']}",
              ]
              write_env(lines)
              print(".env.local patched from GitHub secrets (empty secrets left unchanged)")
          else:
              seed = example_path.read_text(encoding="utf-8") if example_path.is_file() else ""
              port = provided["PORT"] or "3017"
              lines = [
                  "# Generated by GitHub Actions deploy",
                  f"AI_JUDGE_MODE={provided['AI_JUDGE_MODE']}",
                  f"OPENROUTER_API_KEY={provided['OPENROUTER_API_KEY']}",
                  f"OPENROUTER_BASE_URL={provided['OPENROUTER_BASE_URL'] or 'https://openrouter.ai/api/v1'}",
                  f"DATABASE_PATH={provided['DATABASE_PATH'] or './data/ai-judge.sqlite'}",
                  f"PORT={port}",
              ]
              if seed.strip():
                  print("No .env.local on server — created from defaults (BYOK)")
              else:
                  print("No .env.local or .env.example — created with production defaults")
              write_env(lines)
          PY

          echo "--- Installing dependencies ---"
          npm ci

          echo "--- Building Next.js ---"
          npm run build
          test -f .next/BUILD_ID

      - name: Restart ai-judge only
        env:
          # No app secrets here — avoid baking empty Action secrets into PM2.
          HOME: /root
          PM2_HOME: /root/.pm2
        run: |
          set -euo pipefail
          APP_DIR=/root/mims/AI-Judge
          cd "$APP_DIR"

          echo "--- Reloading ai-judge from ecosystem.config.js ---"
          # Plain "pm2 restart" ignores changed args / env. Delete + start
          # from this repo's ecosystem. Do NOT use --update-env.
          pm2 delete ai-judge || true
          pm2 start ecosystem.config.js
          pm2 save
          echo "--- PM2 describe ---"
          pm2 describe ai-judge | head -n 80 || true

      - name: Verify Deployment
        env:
          HOME: /root
          PM2_HOME: /root/.pm2
        run: |
          set -euo pipefail
          cd /root/mims/AI-Judge
          echo "--- PM2 Status ---"
          pm2 status ai-judge
          echo "--- .env.local presence (values hidden) ---"
          if [ -f .env.local ]; then
            echo ".env.local found ($(wc -l < .env.local) lines, mode $(stat -c %a .env.local 2>/dev/null || echo '?'))"
            for key in OPENROUTER_BASE_URL DATABASE_PATH; do
              if grep -q "^${key}=.\+" .env.local; then
                echo "  ✓ $key"
              else
                echo "  · $key unset (defaults apply)"
              fi
            done
            if grep -q '^OPENROUTER_API_KEY=.\+' .env.local; then
              echo "  · OPENROUTER_API_KEY (set — unused in prod BYOK)"
            else
              echo "  · OPENROUTER_API_KEY (empty — BYOK)"
            fi
          else
            echo "WARNING: .env.local MISSING"
            exit 1
          fi
          echo "--- SQLite data directory ---"
          ls -ld data || echo "WARNING: data directory MISSING"
          sleep 3
          status=$(pm2 jlist | python3 -c "import sys,json; apps=json.load(sys.stdin); print(next((a['pm2_env']['status'] for a in apps if a['name']=='ai-judge'), 'missing'))")
          echo "ai-judge status: $status"
          if [ "$status" != "online" ]; then
            echo "--- recent error log ---"
            pm2 logs ai-judge --err --lines 20 --nostream || true
            exit 1
          fi
          echo "--- Loopback health ---"
          HEALTHY=0
          for ATTEMPT in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1:3017/; then
              HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" -ne 1 ]; then
            echo "ERROR: http://127.0.0.1:3017/ did not respond"
            pm2 logs ai-judge --err --lines 40 --nostream || true
            exit 1
          fi
          echo "--- Deploy complete ---"
